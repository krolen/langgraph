[project]
name = "langgraph-web-search-agent"
version = "0.1.0"
description = "LangGraph-based web search agent for local LLMs"
readme = "README.md"
requires-python = "==3.14.*"

dependencies = [
    "langgraph>=1.2.20",
    "langgraph-sdk>=0.4.14",
    "langchain>=1.4.9",
    "langchain-openai>=1.7.4",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "langchain-core>=1.7.6",
    "numpy>=2.5.4",
    "sentence-transformers>=6.2.0",
    "langchain-text-splitters>=1.1.3",
    "fastmcp>=4.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0,<10.0.0",
    "pytest-asyncio>=1.4.1.post1,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "mypy>=2.4.1,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
]
