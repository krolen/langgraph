[project]
name = "langgraph-web-search-agent"
version = "0.1.0"
description = "LangGraph-based web search agent for local LLMs"
readme = "README.md"
requires-python = "==3.14.*"

dependencies = [
    "langgraph>=1.2.0,<2.0.0",
    "langgraph-sdk>=0.3.14,<0.4.0",
    "langchain-community>=0.4.1,<0.5.0",
    "langchain>=1.3.1,<2.0.0",
    "langchain-openai>=1.2.1,<2.0.0",
    "httpx>=0.28.1,<0.29.0",
    "pydantic>=2.13.4,<3.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "openlit>=1.42.0,<2.0.0",
    "mcp>=1.27.1,<2.0.0",
    "langchain-mcp-adapters>=0.2.2,<0.3.0",
    "langchain-core>=1.4.0,<2.0.0",
    "numpy>=2.4.6,<3.0.0",
    "sentence-transformers>=5.5.0,<6.0.0",
    "langchain-text-splitters>=1.1.2,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "mypy>=2.0.0,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]
